# Render Blueprint for the API. The frontend is deployed from ./frontend on Vercel and the database lives on Neon;
# see DEPLOYMENT.md. Nothing secret belongs in this file: values marked sync: false are typed into Render's dashboard.
services:
  - type: web
    name: car-dealership-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev because TypeScript and the Prisma CLI are dev dependencies. Migrations run here, at build time,
    # because Render's pre-deploy command is not available on the free plan; `migrate deploy` only applies pending ones.
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render supplies PORT itself (10000); the API reads it.
      - key: DATABASE_URL # Neon's pooled connection string
        sync: false
      - key: DIRECT_URL # Neon's direct connection string, used for migrations only
        sync: false
      - key: JWT_SECRET # Generated by Render: a long random value that never appears in the repository
        generateValue: true
      - key: CORS_ORIGIN # The Vercel address, e.g. https://your-app.vercel.app
        sync: false
